<script src="resources/node-red-contrib-s2/s2-common.js"></script>
<script type="text/javascript">
  RED.nodes.registerType('s2-rm-config', {
    category: 'config',
    defaults: {
      name: { value: '' },
      resourceId: { value: '' },
      rmName: { value: 'RM: Virtual' },
      roles: { value: 'ENERGY_CONSUMER' },
      controlTypes: { value: 'OPERATION_MODE_BASED_CONTROL' },
      serialNumber: { value: '' },
      manufacturer: { value: 'Victron Energy' },
      model: { value: 'Virtual RM' },
      firmwareVersion: { value: '1.0.0' },
      providesPowerMeasurement: { value: '3_PHASE_SYMMETRIC' },
      providesForecast: { value: false },
      instructionPollIntervalMs: { value: 2000, validate: RED.validators.number() },
      skipInstructionStatus: { value: false }
    },
    label: function () {
      return this.name || this.rmName || 's2-rm-config'
    },
    oneditprepare: function () {
      if (!this.resourceId) {
        var id = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
          var r = Math.random() * 16 | 0
          return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16)
        })
        $('#node-config-input-resourceId').val(id)
      }

      var saved = ($('#node-config-input-controlTypes').val() || '').split(',').map(function (s) { return s.trim() })
      $('.s2-rm-config-ct-checkbox').each(function () {
        $(this).prop('checked', saved.indexOf($(this).val()) !== -1)
      })

      $('.s2-rm-config-ct-checkbox').on('change', function () {
        if ($('.s2-rm-config-ct-checkbox:checked').length === 0) {
          $(this).prop('checked', true)
        }
      })

      var savedRoles = ($('#node-config-input-roles').val() || '').split(',').map(function (s) { return s.trim() })
      $('.s2-rm-config-role-checkbox').each(function () {
        $(this).prop('checked', savedRoles.indexOf($(this).val()) !== -1)
      })

      $('.s2-rm-config-role-checkbox').on('change', function () {
        if ($('.s2-rm-config-role-checkbox:checked').length === 0) {
          $(this).prop('checked', true)
        }
      })

      // Migrate legacy boolean to string value
      if (this.providesPowerMeasurement === true) {
        this.providesPowerMeasurement = '3_PHASE_SYMMETRIC'
        $('#node-config-input-providesPowerMeasurement').val('3_PHASE_SYMMETRIC')
      } else if (this.providesPowerMeasurement === false) {
        this.providesPowerMeasurement = ''
        $('#node-config-input-providesPowerMeasurement').val('')
      }

      $('#node-config-input-skipInstructionStatus').prop('checked', this.skipInstructionStatus === true)

      var DEFAULT_POLL_INTERVAL = 2000
      var hasNonDefaultAdvanced = (this.instructionPollIntervalMs && this.instructionPollIntervalMs !== DEFAULT_POLL_INTERVAL) ||
        this.skipInstructionStatus === true
      if (hasNonDefaultAdvanced) {
        $('#s2-rm-config-advanced-section').show()
        $('#s2-rm-config-advanced-toggle .s2-advanced-chevron').removeClass('fa-chevron-down').addClass('fa-chevron-up')
      }

      $('#s2-rm-config-advanced-toggle').on('click', function (e) {
        e.preventDefault()
        var $section = $('#s2-rm-config-advanced-section')
        $section.toggle()
        $(this).find('.s2-advanced-chevron').toggleClass('fa-chevron-down fa-chevron-up')
      })

      window.__s2Common.initializeTooltips()
    },
    oneditsave: function () {
      var checked = []
      $('.s2-rm-config-ct-checkbox:checked').each(function () {
        checked.push($(this).val())
      })
      $('#node-config-input-controlTypes').val(checked.join(','))

      var checkedRoles = []
      $('.s2-rm-config-role-checkbox:checked').each(function () {
        checkedRoles.push($(this).val())
      })
      $('#node-config-input-roles').val(checkedRoles.join(','))
    }
  })
</script>

<script type="text/html" data-template-name="s2-rm-config">
  <div class="s2-form">

    <div class="form-row">
      <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
      <input type="text" id="node-config-input-name" placeholder="Name (optional)">
    </div>

    <div class="form-row">
      <label for="node-config-input-rmName"><i class="fa fa-tag"></i> RM Name<i class="fa fa-info-circle tooltip-icon" data-tooltip="Human-readable name sent to the CEM in ResourceManagerDetails"></i></label>
      <input type="text" id="node-config-input-rmName" placeholder="e.g. Victron Virtual RM">
    </div>

    <div class="form-row">
      <label for="node-config-input-resourceId"><i class="fa fa-id-card"></i> Resource ID<i class="fa fa-info-circle tooltip-icon" data-tooltip="Stable UUID identifying this Resource Manager. Used in both the CEM URL and ResourceManagerDetails. Auto-generated on first use - do not change after deployment."></i></label>
      <input type="text" id="node-config-input-resourceId" placeholder="Auto-generated UUID">
    </div>

    <div class="form-row">
      <label class="s2-section-label"><i class="fa fa-bolt"></i> Roles<i class="fa fa-info-circle tooltip-icon" data-tooltip="Energy roles advertised to the CEM in ResourceManagerDetails. At least one must be selected."></i></label>
    </div>
    <div class="form-row s2-full-row">
      <div class="s2-control-types-container">
        <label class="s2-checkbox-label"><input type="checkbox" class="s2-rm-config-role-checkbox" value="ENERGY_CONSUMER"> Consumer <i class="fa fa-info-circle tooltip-icon" data-tooltip="Site consumes energy from the grid"></i></label>
        <label class="s2-checkbox-label"><input type="checkbox" class="s2-rm-config-role-checkbox" value="ENERGY_PRODUCER"> Producer <i class="fa fa-info-circle tooltip-icon" data-tooltip="Site produces energy (battery, solar)"></i></label>
        <label class="s2-checkbox-label"><input type="checkbox" class="s2-rm-config-role-checkbox" value="ENERGY_STORAGE"> Storage <i class="fa fa-info-circle tooltip-icon" data-tooltip="Site has energy storage (battery)"></i></label>
      </div>
      <input type="hidden" id="node-config-input-roles">
    </div>

    <div class="form-row">
      <label class="s2-section-label"><i class="fa fa-sliders"></i> Control Types<i class="fa fa-info-circle tooltip-icon" data-tooltip="S2 control types advertised to the CEM in ResourceManagerDetails. At least one must be selected."></i></label>
    </div>
    <div class="form-row s2-full-row">
      <div class="s2-control-types-container">
        <label class="s2-checkbox-label"><input type="checkbox" class="s2-rm-config-ct-checkbox" value="OPERATION_MODE_BASED_CONTROL"> OMBC <i class="fa fa-info-circle tooltip-icon" data-tooltip="Operation Mode Based Control"></i></label>
        <label class="s2-checkbox-label"><input type="checkbox" class="s2-rm-config-ct-checkbox" value="FILL_RATE_BASED_CONTROL"> FRBC <i class="fa fa-info-circle tooltip-icon" data-tooltip="Fill-rate Based Control"></i></label>
        <label class="s2-checkbox-label"><input type="checkbox" class="s2-rm-config-ct-checkbox" value="DEMAND_DRIVEN_BASED_CONTROL"> DDBC <i class="fa fa-info-circle tooltip-icon" data-tooltip="Demand Driven Based Control"></i></label>
        <label class="s2-checkbox-label"><input type="checkbox" class="s2-rm-config-ct-checkbox" value="POWER_PROFILE_BASED_CONTROL"> PPBC <i class="fa fa-info-circle tooltip-icon" data-tooltip="Power Profile Based Control"></i></label>
        <label class="s2-checkbox-label"><input type="checkbox" class="s2-rm-config-ct-checkbox" value="POWER_ENVELOPE_BASED_CONTROL"> PEBC <i class="fa fa-info-circle tooltip-icon" data-tooltip="Power Envelope Based Control"></i></label>
        <label class="s2-checkbox-label"><input type="checkbox" class="s2-rm-config-ct-checkbox" value="NOT_CONTROLABLE"> Not Ctrl <i class="fa fa-info-circle tooltip-icon" data-tooltip="Not Controllable - device cannot be controlled by the CEM"></i></label>
      </div>
      <input type="hidden" id="node-config-input-controlTypes">
    </div>

    <div class="form-row">
      <label for="node-config-input-providesPowerMeasurement"><i class="fa fa-bolt"></i> Power Meas.<i class="fa fa-info-circle tooltip-icon" data-tooltip="Commodity quantities for power measurement. Advertised to the CEM in ResourceManagerDetails."></i></label>
      <select id="node-config-input-providesPowerMeasurement" style="width: 70%;">
        <option value="">None</option>
        <option value="3_PHASE_SYMMETRIC">3-phase symmetric</option>
        <option value="L1_L2_L3">Per phase (L1, L2, L3)</option>
      </select>
    </div>

    <div class="form-row">
      <label for="node-config-input-providesForecast">
        <i class="fa fa-line-chart"></i> Forecast
      </label>
      <input type="checkbox" id="node-config-input-providesForecast" style="width: auto; margin-top: 6px;">
      <span style="margin-left: 6px;">Provides power forecast</span>
    </div>

    <div class="form-row">
      <label for="node-config-input-manufacturer"><i class="fa fa-industry"></i> Manufacturer</label>
      <input type="text" id="node-config-input-manufacturer" placeholder="e.g. Victron Energy">
    </div>

    <div class="form-row">
      <label for="node-config-input-model"><i class="fa fa-cube"></i> Model</label>
      <input type="text" id="node-config-input-model" placeholder="e.g. Virtual AC Load">
    </div>

    <div class="form-row">
      <label for="node-config-input-serialNumber"><i class="fa fa-barcode"></i> Serial Number<i class="fa fa-info-circle tooltip-icon" data-tooltip="Serial number sent in ResourceManagerDetails. Supports context variables: {{global.vrmId}}, {{flow.siteId}}. Defaults to the node ID if empty."></i></label>
      <input type="text" id="node-config-input-serialNumber" placeholder="e.g. {{global.vrmId}} or leave empty for node ID">
    </div>

    <div class="form-row">
      <label for="node-config-input-firmwareVersion"><i class="fa fa-code-fork"></i> Firmware</label>
      <input type="text" id="node-config-input-firmwareVersion" placeholder="e.g. 1.0.0">
    </div>

    <div class="form-row">
      <a href="#" class="s2-advanced-toggle" id="s2-rm-config-advanced-toggle">
        <i class="fa fa-cog"></i> Advanced
        <i class="fa fa-chevron-down s2-advanced-chevron"></i>
      </a>
    </div>

    <div id="s2-rm-config-advanced-section" style="display:none">
      <div class="form-row s2-advanced-row">
        <label for="node-config-input-instructionPollIntervalMs">
          <i class="fa fa-clock-o"></i> Poll interval
          <i class="fa fa-info-circle tooltip-icon" data-tooltip="How often (ms) the RM checks for pending future instructions that are now due. Default: 2000."></i>
        </label>
        <input type="number" id="node-config-input-instructionPollIntervalMs" placeholder="2000" min="100" step="100">
        <span class="s2-unit-label">ms</span>
      </div>
      <div class="form-row s2-full-row">
        <label class="s2-checkbox-label">
          <input type="checkbox" id="node-config-input-skipInstructionStatus">
          Skip instruction status updates
          <i class="fa fa-info-circle tooltip-icon" data-tooltip="When enabled, InstructionStatusUpdate(ACCEPTED/STARTED) messages are not sent automatically. ReceptionStatus and OMBC.Status are still sent. Use when the CEM generates high CPU load from frequent instructions." style="position:static;transform:none;"></i>
        </label>
      </div>
    </div>

  </div>
</script>

<script type="text/html" data-help-name="s2-rm-config">
  <p>Configuration for <b>s2-rm</b>: the Resource Manager's identity, advertised capabilities, and protocol-level behavior. Sent to the CEM in <code>ResourceManagerDetails</code> during the S2 handshake.</p>

  <h3>Identity</h3>
  <p><b>Resource ID</b> is a stable UUID identifying this RM to the CEM - it's also used to build the CEM connection URL on <b>s2-cem-config</b>. Auto-generated the first time the node is added; avoid changing it after deployment, since the CEM associates state with this id.</p>
  <p><b>Roles</b> and <b>Control Types</b> are advertised capabilities - at least one of each must be selected. Control types beyond OMBC and PEBC (FRBC, DDBC, PPBC) have no dedicated node yet; their instructions are still forwarded on <b>s2-rm</b>'s instructions output for you to handle yourself.</p>

  <h3>Power Meas. / Forecast</h3>
  <p>Advertise whether this RM reports <code>PowerMeasurement</code> (as a single 3-phase-symmetric value, or per-phase L1/L2/L3) and/or <code>PowerForecast</code>. These affect what's advertised to the CEM and whether <b>s2-rm</b> emits its <code>PowerMeasurementStart</code> signal on output 1 - they don't gate whether a <code>PowerMeasurement</code>/<code>Forecast</code> command you send is actually forwarded, which happens regardless.</p>

  <h3>Advanced</h3>
  <p><b>Poll interval</b> controls how often <b>s2-rm</b> checks for pending instructions whose <code>execution_time</code> has now arrived (PEBC instructions bypass this queue entirely and are delivered immediately). <b>Skip instruction status updates</b> suppresses automatic <code>InstructionStatusUpdate(ACCEPTED/STARTED)</code> messages - <code>ReceptionStatus</code> and control-type status messages are still sent - useful if the CEM generates high load from frequent instructions.</p>
</script>

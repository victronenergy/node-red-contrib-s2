<script src="resources/node-red-contrib-s2/s2-common.js"></script>
<script src="resources/node-red-contrib-s2/s2-ombc-editor.js"></script>
<script type="text/javascript">
  (function () {
    var editor = window.__s2OmbcEditor

    RED.nodes.registerType('s2-ombc-config', {
      category: 'config',
      defaults: {
        name: { value: '' },
        systemDescription: { value: '' }
      },
      label: function () {
        return this.name || 's2-ombc-config'
      },
      oneditprepare: function () {
        var listSel = '#s2-ombc-mode-list'
        var currentMode = 'friendly'

        $('#node-config-input-systemDescription').typedInput({ types: ['json'] })

        $(listSel).css('min-height', '320px').editableList({
          addItem: editor.addModeItem,
          removeItem: function (opt) {
            // Protected rows can't be removed through the list's own control -
            // restore it. (Still removable by hand-editing Advanced/JSON mode.)
            if (opt && opt.protected) {
              $(listSel).editableList('addItem', opt)
            }
          },
          removable: true,
          sortable: true
        })

        function showFriendlySection () {
          currentMode = 'friendly'
          $('#s2-ombc-friendly-section').show()
          $('#s2-ombc-advanced-section').hide()
          $('#s2-ombc-advanced-warning').hide()
          $('#s2-ombc-tab-friendly').addClass('s2-tab-active')
          $('#s2-ombc-tab-advanced').removeClass('s2-tab-active')
        }

        function showAdvancedSection (warningText) {
          currentMode = 'advanced'
          $('#s2-ombc-friendly-section').hide()
          $('#s2-ombc-advanced-section').show()
          if (warningText) {
            $('#s2-ombc-advanced-warning').text(warningText).show()
          } else {
            $('#s2-ombc-advanced-warning').hide()
          }
          $('#s2-ombc-tab-advanced').addClass('s2-tab-active')
          $('#s2-ombc-tab-friendly').removeClass('s2-tab-active')
        }

        $('#s2-ombc-tab-advanced').on('click', function (e) {
          e.preventDefault()
          if (currentMode === 'advanced') return
          var sysDesc = editor.friendlyStateToSystemDescription(editor.getFriendlyModes(listSel))
          $('#node-config-input-systemDescription').typedInput('value', JSON.stringify(sysDesc, null, 2))
          showAdvancedSection()
        })

        $('#s2-ombc-tab-friendly').on('click', function (e) {
          e.preventDefault()
          if (currentMode === 'friendly') return
          var raw = $('#node-config-input-systemDescription').typedInput('value')
          var parsed
          try {
            parsed = JSON.parse(raw)
          } catch (err) {
            showAdvancedSection('Invalid JSON - fix it before switching to the friendly editor.')
            return
          }
          if (!editor.isFriendlyRepresentable(parsed)) {
            showAdvancedSection('This system description uses something only Advanced mode supports (a genuine power range, a non-standard commodity, a blocked transition, or a timer not matching the per-mode minimum-duration pattern) - continue editing it here.')
            return
          }
          $(listSel).editableList('empty')
          editor.systemDescriptionToFriendlyState(parsed).forEach(function (m) {
            $(listSel).editableList('addItem', m)
          })
          showFriendlySection()
        })

        var raw = this.systemDescription
        var parsed = null
        if (raw) {
          try { parsed = JSON.parse(raw) } catch (e) { parsed = null }
        }

        if (!raw) {
          $(listSel).editableList('addItem', editor.defaultStandbyMode())
          showFriendlySection()
        } else if (parsed && editor.isFriendlyRepresentable(parsed)) {
          editor.systemDescriptionToFriendlyState(parsed).forEach(function (m) {
            $(listSel).editableList('addItem', m)
          })
          showFriendlySection()
        } else {
          $('#node-config-input-systemDescription').typedInput('value', raw)
          showAdvancedSection()
        }

        window.__s2Common.initializeTooltips()
      },
      oneditsave: function () {
        // Only friendly mode needs an explicit save step - Advanced mode's JSON
        // typedInput already holds the value that gets read automatically.
        var $list = $('#s2-ombc-mode-list')
        if ($('#s2-ombc-tab-friendly').hasClass('s2-tab-active') && $list.length) {
          var sysDesc = editor.friendlyStateToSystemDescription(editor.getFriendlyModes('#s2-ombc-mode-list'))
          $('#node-config-input-systemDescription').typedInput('value', JSON.stringify(sysDesc, null, 2))
        }
      }
    })
  })()
</script>

<script type="text/html" data-template-name="s2-ombc-config">
  <div class="s2-form">

    <div class="form-row">
      <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
      <input type="text" id="node-config-input-name" placeholder="Name (optional)">
    </div>

    <div class="form-row">
      <label class="s2-section-label"><i class="fa fa-list"></i> System Description<i class="fa fa-info-circle tooltip-icon" data-tooltip="OMBC.SystemDescription: the operation modes this device can be in, and how it can transition between them. Sent to the CEM by s2-ombc once OMBC is the selected control type. Friendly mode covers the common case (fixed-power modes, every mode able to transition to every other, an optional per-mode minimum-duration timer); switch to Advanced for anything else - a genuine power range, a non-standard commodity, a blocked transition, or a bespoke timer."></i></label>
    </div>

    <div class="form-row s2-full-row">
      <div class="s2-tabs">
        <a href="#" id="s2-ombc-tab-friendly" class="s2-tab s2-tab-active">Friendly</a>
        <a href="#" id="s2-ombc-tab-advanced" class="s2-tab">Advanced (JSON)</a>
      </div>
    </div>

    <div id="s2-ombc-friendly-section" class="form-row s2-full-row">
      <ol id="s2-ombc-mode-list"></ol>
    </div>

    <div id="s2-ombc-advanced-section" class="form-row s2-full-row" style="display:none;">
      <div id="s2-ombc-advanced-warning" class="s2-ombc-advanced-warning" style="display:none;"></div>
      <input type="text" id="node-config-input-systemDescription">
    </div>

  </div>
</script>

<script type="text/html" data-help-name="s2-ombc-config">
  <p>Configuration for <b>s2-ombc</b>: the OMBC system description (operation modes and how the device can transition between them). Sent to the CEM by <b>s2-ombc</b> once the CEM has selected Operation Mode Based Control.</p>

  <h3>Friendly mode</h3>
  <p>Covers the common case: a list of operation modes, each with a diagnostic label and a fixed power level (the same value on all three phases, or a separate value per phase). Every mode is assumed able to transition to every other mode - there is no separate step to define transitions.</p>
  <p>A "Standby/off" mode is always present and can't be removed from the list itself (use Advanced mode if you genuinely don't want one). Add further modes with the "add" button below the list.</p>
  <p>Each mode also has an optional "Minimum time in this mode" (minutes + seconds). When set, entering that mode starts an S2 timer that must elapse before the CEM may instruct a transition away from it again - useful for equipment (e.g. a compressor or boiler element) that must not be cycled faster than every few minutes. Leave both fields at 0 for no minimum (the default).</p>

  <h3>Advanced (JSON) mode</h3>
  <p>The raw <code>OMBC.SystemDescription</code> JSON (<code>operationModes</code>, <code>transitions</code>, <code>timers</code>), for anything friendly mode doesn't cover:</p>
  <ul>
    <li>a genuine power range (a mode whose lower and upper bound differ, rather than one fixed value)</li>
    <li>a commodity quantity other than 3-phase-symmetric or per-phase L1/L2/L3</li>
    <li>blocking a specific transition, rather than every mode being able to reach every other mode</li>
    <li>a mode reachable only under abnormal conditions</li>
    <li>a bespoke timer - anything other than one per-mode minimum-duration timer wired symmetrically into every transition in/out of that mode (which friendly mode's own "Minimum time in this mode" field already covers)</li>
  </ul>
  <p>Switching from Friendly to Advanced converts the current modes to JSON. Switching back only works if the JSON still matches what friendly mode can represent (fixed-power modes, every mode transitioning to every other, and any timers matching the per-mode minimum-duration pattern above) - otherwise the editor stays in Advanced mode and explains why, rather than discarding anything.</p>
</script>
